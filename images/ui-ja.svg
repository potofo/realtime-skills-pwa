<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" width="560" height="650" role="img" aria-label="Realtime Skills 画面モック（日本語・接続中）">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',Meiryo,sans-serif;fill:#e8f5fb}.b{font-weight:700}.dim{opacity:.4}.lbl{font-size:13px;opacity:.7}.note{font-size:12.5px;opacity:.6}</style>
<rect width="560" height="650" fill="#091e2b"/>
<rect x="30" y="30" width="500" height="590" rx="20" fill="#102d3f" stroke="#365366"/>
<text x="60" y="98" font-size="32" class="b">Realtime Skills</text>
<text x="60" y="140" font-size="16">iPhone / PWA / GPT-Realtime</text>
<text x="60" y="190" font-size="16">言語</text>
<g class="dim"><rect x="108" y="166" width="120" height="38" rx="10" fill="#091e2b" stroke="#365366"/><text x="122" y="190" font-size="16">日本語</text><path d="M206 182l5 5 5-5" stroke="#e8f5fb" stroke-width="2" fill="none"/></g>
<text x="60" y="246" font-size="16">音声</text>
<g class="dim"><rect x="108" y="222" width="110" height="38" rx="10" fill="#091e2b" stroke="#365366"/><text x="122" y="246" font-size="16">marin</text><path d="M196 238l5 5 5-5" stroke="#e8f5fb" stroke-width="2" fill="none"/></g>
<g class="dim"><rect x="60" y="280" width="108" height="52" rx="12" fill="#65d5c0"/><text x="114" y="312" font-size="16" class="b" text-anchor="middle" style="fill:#0a2730">通話開始</text></g>
<rect x="176" y="280" width="76" height="52" rx="12" fill="#65d5c0"/><text x="214" y="312" font-size="16" class="b" text-anchor="middle" style="fill:#0a2730">終了</text>
<text x="60" y="378" font-size="16" class="b">接続中：話しかけてください</text>
<text x="60" y="416" class="lbl">接続時間</text><text x="156" y="416" class="lbl">API利用料金（概算）</text>
<text x="60" y="452" font-size="26" class="b">02:15</text><text x="156" y="452" font-size="26" class="b">¥5.47</text>
<text x="60" y="500" font-size="16">「今何時？」やデータフォルダー内のファイルについて話し</text>
<text x="60" y="524" font-size="16">かけてください。</text>
<text x="60" y="566" class="note">料金はAPIが返すトークン使用量から算出した概算です（定価・税別、</text>
<text x="60" y="586" class="note">1ドル=160円換算）。</text>
</svg>
