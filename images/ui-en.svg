<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 650" width="560" height="650" role="img" aria-label="Realtime Skills screen mock (English, connected)">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Hiragino Sans','Noto Sans JP',Meiryo,sans-serif;fill:#e8f5fb}.b{font-weight:700}.dim{opacity:.4}.lbl{font-size:13px;opacity:.7}.note{font-size:12.5px;opacity:.6}</style>
<rect width="560" height="650" fill="#091e2b"/>
<rect x="30" y="30" width="500" height="590" rx="20" fill="#102d3f" stroke="#365366"/>
<text x="60" y="98" font-size="32" class="b">Realtime Skills</text>
<text x="60" y="140" font-size="16">iPhone / PWA / GPT-Realtime</text>
<text x="60" y="190" font-size="16">Language</text>
<g class="dim"><rect x="150" y="166" width="120" height="38" rx="10" fill="#091e2b" stroke="#365366"/><text x="164" y="190" font-size="16">English</text><path d="M248 182l5 5 5-5" stroke="#e8f5fb" stroke-width="2" fill="none"/></g>
<text x="60" y="246" font-size="16">Voice</text>
<g class="dim"><rect x="112" y="222" width="110" height="38" rx="10" fill="#091e2b" stroke="#365366"/><text x="126" y="246" font-size="16">marin</text><path d="M200 238l5 5 5-5" stroke="#e8f5fb" stroke-width="2" fill="none"/></g>
<g class="dim"><rect x="60" y="280" width="114" height="52" rx="12" fill="#65d5c0"/><text x="117" y="312" font-size="16" class="b" text-anchor="middle" style="fill:#0a2730">Start call</text></g>
<rect x="182" y="280" width="74" height="52" rx="12" fill="#65d5c0"/><text x="219" y="312" font-size="16" class="b" text-anchor="middle" style="fill:#0a2730">End</text>
<text x="60" y="378" font-size="16" class="b">Connected: start speaking</text>
<text x="60" y="416" class="lbl">Connected time</text><text x="200" y="416" class="lbl">Estimated API cost</text>
<text x="60" y="452" font-size="26" class="b">02:15</text><text x="200" y="452" font-size="26" class="b">$0.0342</text>
<text x="60" y="500" font-size="16">Ask "What time is it?" or about the files in the</text>
<text x="60" y="524" font-size="16">data folder.</text>
<text x="60" y="566" class="note">Cost is estimated from token usage reported by the API (list</text>
<text x="60" y="586" class="note">prices, excluding tax).</text>
</svg>
