<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 570" role="img" aria-label="Single container realtime skills PWA architecture">
<style>text{font-family:Arial,'Noto Sans',sans-serif;fill:#173247}.title{font-size:26px;font-weight:bold}.heading{font-size:19px;font-weight:bold}.small{font-size:14px}.box{fill:#e8f4fc;stroke:#4e87b0;stroke-width:2}.server{fill:#eef8ee;stroke:#4d9965;stroke-width:2}.model{fill:#fff1dc;stroke:#c28a3b;stroke-width:2}.arrow{stroke:#456575;stroke-width:2.5;fill:none;marker-end:url(#arr)}</style>
<defs><marker id="arr" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#456575"/></marker></defs>
<text x="35" y="43" class="title">Realtime Skills PWA - Single Container</text>
<rect x="35" y="95" width="265" height="260" rx="16" class="box"/><text x="58" y="130" class="heading">iPhone PWA (Safari)</text><text x="58" y="166" class="small">- Mic / speaker</text><text x="58" y="192" class="small">- RealtimeAgent + SDK</text><text x="58" y="218" class="small">- WebRTC transport</text><text x="58" y="244" class="small">- run_skill tool wrapper</text>
<rect x="370" y="95" width="290" height="370" rx="16" class="server"/><text x="392" y="130" class="heading">Docker (1 container)</text><text x="392" y="155" class="small">Node.js / Express (1 process)</text><rect x="392" y="180" width="246" height="75" rx="8" fill="#fff" stroke="#6aa17d"/><text x="405" y="207" class="small">Static PWA + /api/token</text><text x="405" y="232" class="small">/api/config</text><rect x="392" y="282" width="246" height="120" rx="8" fill="#fff" stroke="#6aa17d"/><text x="405" y="309" class="small">/api/skills/current-time</text><text x="405" y="340" class="small">AGENTS.md</text><text x="405" y="368" class="small">skills/*/SKILL.md</text>
<rect x="735" y="95" width="230" height="260" rx="16" class="model"/><text x="756" y="130" class="heading">OpenAI Cloud</text><text x="756" y="170" class="small">GPT-Realtime 2.1</text><text x="756" y="200" class="small">Voice + reasoning</text><text x="756" y="230" class="small">Tool call decisions</text>
<path class="arrow" d="M300 188H368"/><text x="308" y="177" class="small">HTTPS</text><path class="arrow" d="M300 285H350V341H390"/><text x="310" y="325" class="small">Skill API</text><path class="arrow" d="M300 145V73H850V95"/><text x="450" y="65" class="small">WebRTC audio + events (direct)</text><path class="arrow" d="M660 212H734"/><text x="660" y="201" class="small">Token</text>
<text x="35" y="514" class="small">Note: browser tool invokes an allowlisted Node.js skill endpoint; no second AI agent.</text><text x="35" y="539" class="small">Production: HTTPS reverse proxy, authentication, rate limits and per-user authorization required.</text>
</svg>
